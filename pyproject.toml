[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "k12-teacher-mcp"
version = "0.1.0"
description = "Local MCP tools for Chinese K-12 teaching guidance, validation and Word documents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.20,<2", "python-docx==1.1.2"]

[project.scripts]
k12-teacher-mcp = "k12_teacher_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/k12_teacher_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"k12-teacher-skill-planning" = "k12_teacher_mcp/assets/planning"
"k12-teacher-skill-differentiation" = "k12_teacher_mcp/assets/differentiation"

[tool.hatch.build.targets.sdist]
include = ["src", "k12-teacher-skill-planning", "k12-teacher-skill-differentiation", "pyproject.toml", "README.md", "LICENSE", "tests"]
